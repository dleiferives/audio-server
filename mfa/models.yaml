# MFA model registry for audio-server
# Maps BCP-47 language codes to MFA acoustic model + dictionary names.
# G2P model is optional (provides pronunciations for out-of-vocabulary words).

models:
  el:
    acoustic: greek_cv
    dictionary: greek_cv
    g2p: mfa/models/greek_cv_g2p.zip
