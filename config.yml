# ── server ──
addr: "0.0.0.0:8010"
api_key: ""
web_dir: "web"

# ── audio ──
audio_store_dir: "audio-output"
audio_ttl_seconds: 0          # 0 = forever. Governs GENERATED TTS output and
                              # separation stems only, never STT input.

# ── STT fine-tuning corpus ──
# Off by default: this records the audio people speak into the STT endpoints,
# paired with its transcript, as training data. It is intentionally not governed
# by audio_ttl_seconds and is never swept — a corpus that expires is useless.
# Writes 16 kHz mono WAV plus an append-only manifest.jsonl; live sessions store
# both the whole session and one clip per completed line.
stt_capture_enabled: false
stt_capture_dir: "stt-corpus"
max_input_chars: 1000000
request_timeout_seconds: 0    # 0 = disabled
max_concurrency: 2

# ── espeak-ng ──
espeak_path: "espeak-ng"
espeak_default_voice: "en"
mp3_bitrate: "48k"
ffmpeg_path: "ffmpeg"

# ── GPU providers (audio.cpp) ──
omnivoice_enabled: true
omnivoice_addr: "http://127.0.0.1:8020"
omnivoice_concurrency: 1
supertonic_addr: "http://127.0.0.1:8022"

# OmniVoice peak VRAM grows with input length, so long input is segmented into
# chunks. supertonic has no such limit and is deliberately left unsegmented.
# Unset (or 0) disables segmentation entirely.
omnivoice_max_words: 64        # hard cap per chunk
omnivoice_target_words: 32     # preferred chunk size, usually 1-3 sentences
segment_python: "/home/dleiferives/.pyenv/versions/audio-server/bin/python"
segment_script: "tts/segment/segment.py"
audiocpp_bin: "audio.cpp/build/linux-cuda-release/bin/audiocpp_server"
audiocpp_idle_unload_seconds: 0  # keep resident until budget eviction; positive = idle timeout
max_vram_mib: 2048             # below supertonic+omnivoice combined, so only one model is ever resident
model_vram_mib:                # conservative residency estimates; tune per GPU/build
  supertonic: 768
  omnivoice: 1600
  parakeet: 1024           # measured peak 867 over an idle card during cold load
  moonshine: 768           # measured peak 463, but the buffer grows with utterance length
  nemotron: 1280
  qwen3-asr-0.6b: 1792
  qwen3-asr-1.7b: 3584
  faster-whisper: 6000
  cohere-transcribe: 3200
  voxtral-realtime: 4800
  sortformer: 512
  bs-roformer: 2048
  htdemucs: 2048
  htdemucs-dnr: 2560
  pyannote: 1536

# ── STT ──
stt_enabled: true
default_stt_provider: "parakeet"
parakeet_enabled: true
parakeet_addr: "http://127.0.0.1:8026"
nemotron_addr: ""
qwen3_asr_0_6b_enabled: false
qwen3_asr_0_6b_addr: "http://127.0.0.1:8027"
qwen3_asr_1_7b_enabled: false
qwen3_asr_1_7b_addr: "http://127.0.0.1:8028"

# transcribe.cpp accepts many GGUF ASR families; Cohere Q8 is our first model.
transcribecpp_enabled: false
transcribecpp_provider_id: "cohere-transcribe"
transcribecpp_addr: "http://127.0.0.1:8031"
transcribecpp_bin: "bin/transcribecpp_server"
transcribecpp_port: 8031
transcribecpp_model: "models/cohere-transcribe-03-2026-Q8_0.gguf"
transcribecpp_backend: "cuda"
transcribecpp_threads: 0

# True incremental STT; use the WebSocket endpoint for live PCM audio.
voxtral_realtime_enabled: false
voxtral_realtime_addr: "http://127.0.0.1:8032"
voxtral_realtime_port: 8032
voxtral_realtime_model: "models/Voxtral-Mini-4B-Realtime-2602-Q4_K_M.gguf"
voxtral_realtime_backend: "cuda"
voxtral_realtime_threads: 0

# ── autodubbing analysis ──
analysis_enabled: false
analysis_max_upload_mib: 2048
sortformer_addr: ""
sortformer_port: 8033
bs_roformer_addr: ""
bs_roformer_port: 8035
htdemucs_addr: ""
htdemucs_port: 8039
default_analysis_separator: "bs-roformer"
wespeaker_enabled: false
wespeaker_addr: "http://127.0.0.1:8034"
wespeaker_port: 8034
wespeaker_bin: "bin/wespeaker_server"
wespeaker_model: "models/wespeaker/voxceleb_gemini_dfresnet114_LM.onnx"
pyannote_enabled: true
pyannote_addr: "http://127.0.0.1:8036"
pyannote_port: 8036
pyannote_python: "speaker/pyannote/.venv/bin/python"
pyannote_script: "speaker/pyannote/server.py"
pyannote_model: "pyannote/speaker-diarization-community-1"
pyannote_device: "cuda"
default_analysis_diarizer: "sortformer"
htdemucs_dnr_enabled: true
htdemucs_dnr_addr: "http://127.0.0.1:8041"
htdemucs_dnr_port: 8041
htdemucs_dnr_python: "separation/htdemucs-dnr/.venv/bin/python"
htdemucs_dnr_script: "separation/htdemucs-dnr/server.py"
htdemucs_dnr_device: "cuda"

# ── alignment (MFA) ──
align_enabled: true
align_mfa_env: "mfa/env"
align_mfa_work_dir: "mfa/work"
align_mfa_models_config: "mfa/models.yaml"

# ── disabled providers ──
kokoro_enabled: false

# ── voice cloning fallbacks (OmniVoice alternatives) ──
chatterbox_enabled: true
chatterbox_addr: "http://127.0.0.1:8037"
chatterbox_port: 8037
chatterbox_python: "tts/chatterbox/.venv/bin/python"
chatterbox_script: "tts/chatterbox/server.py"
chatterbox_device: "cuda"

cosyvoice_enabled: true
cosyvoice_addr: "http://127.0.0.1:8038"
cosyvoice_port: 8038
cosyvoice_python: "tts/cosyvoice/.venv/bin/python"
cosyvoice_script: "tts/cosyvoice/server.py"
cosyvoice_repo_path: "tts/cosyvoice/repo"
cosyvoice_model_dir: "tts/cosyvoice/pretrained_models/CosyVoice2-0.5B"
cosyvoice_device: "cuda"

# ── faster-whisper (shared GPU lifecycle) ──
faster_whisper_enabled: false
faster_whisper_addr: "http://127.0.0.1:8030"
faster_whisper_python: "/home/dleiferives/.pyenv/versions/audio-server/bin/python"
faster_whisper_script: "stt/fasterwhisper/server.py"
faster_whisper_port: 8030
faster_whisper_model_size: "large-v3"
faster_whisper_device: "cuda"
faster_whisper_compute_type: "int8"

# ── Moonshine v2 (CPU only, streaming) ──
# The moonshine-voice pip package, not the GGUF model audio.cpp serves. It runs
# entirely on the CPU, so it carries no model_vram_mib entry and is never
# evicted by the residency budget. Moonshine publishes one model per language;
# moonshine_language picks the default and a request's language overrides it.
# There is no BASE_STREAMING arch: the choices are MEDIUM/SMALL/TINY_STREAMING,
# and MEDIUM measures both faster and more accurate than SMALL on CPU.
moonshine_enabled: true
moonshine_addr: "http://127.0.0.1:8042"
moonshine_port: 8042
moonshine_python: "stt/moonshine/.venv/bin/python"
moonshine_script: "stt/moonshine/server.py"
moonshine_language: "en"
moonshine_model_arch: "MEDIUM_STREAMING"
# Seconds between streaming transcript refreshes. This is the main latency knob:
# a refresh costs far more than ingesting audio, so refreshing too often drives
# CPU past realtime and the transcript falls progressively further behind the
# speaker. The sidecar throttles to this interval regardless of how small the
# frames a client sends are.
moonshine_update_interval: 0.5
moonshine_threads: 0            # 0 = all physical cores; 8 measured faster than all on this box
# Keep the model resident and load it at startup. Moonshine costs no VRAM, and an
# idle resident model uses no CPU, so the only cost is RAM. Reloading costs about
# a second on the first utterance after a pause, which is very noticeable when
# dictating intermittently.
moonshine_idle_unload_seconds: 0
moonshine_preload: true
