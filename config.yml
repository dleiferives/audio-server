# ── server ──
addr: "0.0.0.0:8010"
api_key: ""
web_dir: "web"

# ── audio ──
audio_store_dir: "audio-output"
audio_ttl_seconds: 0          # 0 = forever
max_input_chars: 1000000
request_timeout_seconds: 0    # 0 = disabled
max_concurrency: 2

# ── espeak-ng ──
espeak_path: "espeak-ng"
espeak_default_voice: "en"
mp3_bitrate: "48k"
ffmpeg_path: "ffmpeg"

# ── GPU providers (audio.cpp) ──
omnivoice_enabled: false
omnivoice_addr: ""
omnivoice_concurrency: 1
supertonic_addr: "http://127.0.0.1:8022"
audiocpp_bin: "audio.cpp/build/linux-cuda-release/bin/audiocpp_server"
audiocpp_idle_unload_seconds: 0  # keep resident until budget eviction; positive = idle timeout
max_vram_mib: auto             # auto = total VRAM reported by nvidia-smi
model_vram_mib:                # conservative residency estimates; tune per GPU/build
  supertonic: 1024
  omnivoice: 2048
  parakeet: 1280
  nemotron: 1280
  qwen3-asr-0.6b: 1792
  qwen3-asr-1.7b: 3584
  faster-whisper: 6000
  cohere-transcribe: 3200
  voxtral-realtime: 4800
  sortformer: 512
  bs-roformer: 2048

# ── STT ──
stt_enabled: false
default_stt_provider: ""
parakeet_enabled: false
parakeet_addr: ""
nemotron_addr: ""
qwen3_asr_0_6b_enabled: false
qwen3_asr_0_6b_addr: "http://127.0.0.1:8027"
qwen3_asr_1_7b_enabled: false
qwen3_asr_1_7b_addr: "http://127.0.0.1:8028"

# transcribe.cpp accepts many GGUF ASR families; Cohere Q8 is our first model.
transcribecpp_enabled: false
transcribecpp_provider_id: "cohere-transcribe"
transcribecpp_addr: "http://127.0.0.1:8031"
transcribecpp_bin: "bin/transcribecpp_server"
transcribecpp_port: 8031
transcribecpp_model: "models/cohere-transcribe-03-2026-Q8_0.gguf"
transcribecpp_backend: "cuda"
transcribecpp_threads: 0

# True incremental STT; use the WebSocket endpoint for live PCM audio.
voxtral_realtime_enabled: false
voxtral_realtime_addr: "http://127.0.0.1:8032"
voxtral_realtime_port: 8032
voxtral_realtime_model: "models/Voxtral-Mini-4B-Realtime-2602-Q4_K_M.gguf"
voxtral_realtime_backend: "cuda"
voxtral_realtime_threads: 0

# ── autodubbing analysis ──
analysis_enabled: false
analysis_max_upload_mib: 2048
sortformer_addr: ""
sortformer_port: 8033
bs_roformer_addr: ""
bs_roformer_port: 8035
wespeaker_enabled: false
wespeaker_addr: "http://127.0.0.1:8034"
wespeaker_port: 8034
wespeaker_bin: "bin/wespeaker_server"
wespeaker_model: "models/wespeaker/voxceleb_gemini_dfresnet114_LM.onnx"

# ── alignment (MFA) ──
align_enabled: false
align_mfa_env: "mfa/env"
align_mfa_work_dir: "mfa/work"
align_mfa_models_config: "mfa/models.yaml"

# ── disabled providers ──
kokoro_enabled: false

# ── faster-whisper (shared GPU lifecycle) ──
faster_whisper_enabled: false
faster_whisper_addr: "http://127.0.0.1:8030"
faster_whisper_python: "/home/dleiferives/.pyenv/versions/audio-server/bin/python"
faster_whisper_script: "stt/fasterwhisper/server.py"
faster_whisper_port: 8030
faster_whisper_model_size: "large-v3"
faster_whisper_device: "cuda"
faster_whisper_compute_type: "int8"
