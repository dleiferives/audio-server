<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Server</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #0f0f0f; color: #e0e0e0;
  max-width: 640px; margin: 0 auto; padding: 24px 16px;
}
h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 20px; }
.status { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.badge {
  font-size: 0.75rem; padding: 3px 10px; border-radius: 12px;
  background: #1a1a1a; border: 1px solid #333;
}
.badge.ok { border-color: #2e7d32; color: #66bb6a; }
.badge.cold { border-color: #8a6d1d; color: #e2bd5b; }
.badge.down { border-color: #c62828; color: #ef5350; }
section {
  background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
  padding: 16px; margin-bottom: 16px;
}
section h2 { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; color: #aaa; }
label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 4px; }
input, select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid #333; border-radius: 6px;
  background: #111; color: #e0e0e0; font-size: 0.85rem; margin-bottom: 10px;
}
textarea { resize: vertical; min-height: 60px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
button {
  padding: 8px 18px; border: none; border-radius: 6px;
  font-size: 0.85rem; font-weight: 500; cursor: pointer;
  background: #1e88e5; color: #fff; transition: background 0.15s;
}
button:hover { background: #1976d2; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.secondary { background: #333; }
button.secondary:hover { background: #444; }
button.recording { background: #c62828; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
audio { width: 100%; margin-top: 10px; }
.output { margin-top: 10px; }
.output pre {
  background: #111; border: 1px solid #2a2a2a; border-radius: 6px;
  padding: 10px; font-size: 0.8rem; overflow-x: auto; max-height: 200px;
}
.spinner {
  display: inline-block; width: 14px; height: 14px; border: 2px solid #333;
  border-top: 2px solid #1e88e5; border-radius: 50%; animation: spin 0.6s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.instruct-group { margin-bottom: 10px; }
.instruct-group .group-label { font-size: 0.75rem; color: #666; margin-bottom: 4px; }
.instruct-items { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.instruct-items label { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; color: #bbb; cursor: pointer; margin-bottom: 0; }
.instruct-items input[type=checkbox] { width: auto; margin-bottom: 0; accent-color: #1e88e5; }
</style>
</head>
<body>

<h1>🎙️ Audio Server</h1>

<div class="status" id="status"></div>

<section>
  <h2>Text-to-Speech</h2>
  <label>Text</label>
  <textarea id="tts-input" placeholder="Type something..."></textarea>
  <div class="row">
    <div>
      <label>Provider</label>
      <select id="tts-provider"></select>
    </div>
    <div>
      <label>Voice</label>
      <select id="tts-voice"></select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>Language</label>
      <select id="tts-language">
        <option value="auto">Auto</option>
      </select>
    </div>
    <div>
      <label>Speed</label>
      <input id="tts-speed" type="number" min="0.25" max="4" step="0.1" value="1">
    </div>
  </div>
  <div class="row">
    <div>
      <label>Format</label>
      <select id="tts-format">
        <option value="mp3">MP3</option>
        <option value="wav">WAV</option>
        <option value="ogg">OGG</option>
        <option value="opus">Opus</option>
        <option value="flac">FLAC</option>
        <option value="pcm">PCM (streaming)</option>
      </select>
    </div>
  </div>
  <div id="tts-provider-opts" hidden></div>
  <button id="tts-speak">Speak</button>
  <div class="output" id="tts-output"></div>
</section>

<section>
  <h2>Forced Alignment</h2>
  <p style="font-size:0.8rem;color:#888;margin-bottom:10px;">Align transcript to audio — returns word and phone timestamps.</p>
  <div>
    <label>Audio file</label>
    <input type="file" id="align-audio" accept="audio/*">
  </div>
  <div>
    <label>Transcript (exact text spoken)</label>
    <textarea id="align-transcript" placeholder="What was spoken in the audio..." rows="4"></textarea>
  </div>
  <div class="row">
    <div>
      <label>Language</label>
      <select id="align-language"></select>
    </div>
    <div style="align-self:end;">
      <button id="align-submit">Align</button>
    </div>
  </div>
  <div id="align-status" style="margin-top:10px;font-size:0.8rem;color:#888;"></div>
  <div class="output" id="align-output"></div>
</section>

<section>
  <h2>Speech-to-Text</h2>
  <div class="row" style="margin-bottom:8px;">
    <div>
      <label>Provider</label>
      <select id="stt-provider"></select>
    </div>
    <div>
      <label>Language</label>
      <select id="stt-language">
        <option value="">Auto-detect</option>
        <option value="en-US">English</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
        <option value="el-GR">Greek</option>
      </select>
    </div>
  </div>
  <div class="row">
    <button id="stt-record" class="secondary">🎤 Start live mic</button>
    <button id="stt-upload-trigger" class="secondary">📁 Upload file</button>
  </div>
  <input type="file" id="stt-file" accept="audio/*" hidden>
  <div style="margin-top: 10px; font-size: 0.8rem; color: #888;" id="stt-status">Ready</div>
  <div class="output" id="stt-output"></div>
</section>

<script>
const API = '';

async function init() {
  const [health, capabilities] = await Promise.all([
    fetch(API + '/healthz').then(r => r.json()).catch(() => null),
    fetch(API + '/v1/audio/capabilities').then(r => r.json()).catch(() => null),
  ]);

  renderStatus(health);
  renderProviders(health);
  renderLanguages(capabilities);
  renderVoices();
  renderSttProviders(health);

  ttsProviderEl.onchange = () => { renderVoices(); renderProviderOpts(); };
  ttsLanguageEl.onchange = renderVoices;
  document.getElementById('tts-speak').onclick = doTts;
  document.getElementById('stt-record').onclick = toggleRecord;
  document.getElementById('stt-upload-trigger').onclick = () => sttFileEl.click();
  sttFileEl.onchange = doSttUpload;
  document.getElementById('align-submit').onclick = doAlign;
  loadAlignLanguages();
}

function renderSttProviders(health) {
  const sel = document.getElementById('stt-provider');
  sel.innerHTML = '';
  const providers = health?.providers || {};
  for (const [id, state] of Object.entries(providers)) {
    if (id === 'faster-whisper' || id === 'parakeet' || id === 'nemotron' || id.startsWith('qwen3-asr-')) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = id + (state === 'ok' ? '' : state === 'cold' ? ' (cold; starts on request)' : ' (offline)');
      sel.appendChild(opt);
    }
  }
  if ([...sel.options].some(opt => opt.value === 'parakeet')) {
    sel.value = 'parakeet';
  }
  if (!sel.children.length) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '(no STT providers)';
    sel.appendChild(opt);
  }
}

function renderStatus(health) {
  const el = document.getElementById('status');
  if (!health) {
    el.innerHTML = '<span class="badge down">Server unreachable</span>';
    return;
  }
  const providers = health.providers || {};
  el.innerHTML = Object.entries(providers).map(([name, state]) =>
    `<span class="badge ${state === 'ok' ? 'ok' : state === 'cold' ? 'cold' : 'down'}">${name}: ${state}</span>`
  ).join('');
}

function renderProviders(health) {
  const sel = document.getElementById('tts-provider');
  sel.innerHTML = '';
  const providers = health?.providers || {};
  for (const [id, state] of Object.entries(providers)) {
    // Skip STT providers
    if (id === 'faster-whisper' || id === 'parakeet' || id === 'nemotron' || id.startsWith('qwen3-asr-')) continue;
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = id + (state === 'ok' ? '' : state === 'cold' ? ' (cold; starts on request)' : ' (down)');
    sel.appendChild(opt);
  }
}

async function renderVoices() {
  const provider = ttsProviderEl.value;
  const sel = document.getElementById('tts-voice');
  sel.innerHTML = '<option value="auto">Auto (server chooses)</option>';
  if (!provider) return;
  try {
    const params = new URLSearchParams({ provider });
    if (ttsLanguageEl.value) params.set('language', ttsLanguageEl.value);
    const r = await fetch(API + '/v1/audio/voices?' + params.toString());
    const data = await r.json();
    for (const v of (data.voices || [])) {
      const opt = document.createElement('option');
      opt.value = v.voice;
      opt.textContent = `${v.name} (${v.language})`;
      sel.appendChild(opt);
    }
  } catch (e) {
    if (sel.options.length === 1) sel.options[0].textContent = 'Auto (server chooses; catalog unavailable)';
  }
}

function renderLanguages(capabilities) {
  const sel = document.getElementById('tts-language');
  const languages = Array.isArray(capabilities?.languages) && capabilities.languages.length
    ? capabilities.languages
    : LANGUAGES;
  for (const lang of languages) {
    const opt = document.createElement('option');
    opt.value = lang;
    opt.textContent = lang;
    sel.appendChild(opt);
  }
}

async function doTts() {
  const input = ttsInputEl.value.trim();
  if (!input) return;
  const btn = document.getElementById('tts-speak');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const provider = ttsProviderEl.value;
  const format = ttsFormatEl.value;
  const isPcm = format === 'pcm';
  const req = {
    model: provider,
    input,
    language: ttsLanguageEl.value || undefined,
    voice: ttsVoiceEl.value,
    response_format: format,
    speed: parseFloat(ttsSpeedEl.value) || 1,
    stream: isPcm,
  };
  const opts = getProviderOptions();
  if (opts) req.provider_options = opts;

  try {
    const r = await fetch(API + '/v1/audio/speech', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(req),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ error: r.statusText }));
      throw new Error(err.error);
    }

    const jobID = r.headers.get('X-Job-ID');
    const reader = r.body.getReader();
    const chunks = [];
    let totalBytes = 0;

    // Start polling progress
    let progressTimer = null;
    if (jobID) {
      progressTimer = setInterval(async () => {
        try {
          const sr = await fetch(API + '/v1/audio/jobs/' + jobID);
          const sj = await sr.json();
          const c = sj.stream_chunks || 0;
          btn.textContent = `Generating... (${c} chunks)`;
          if (sj.status === 'failed') {
            throw new Error(sj.error || 'job failed');
          }
        } catch (e) { /* poll silently */ }
      }, 1000);
    }

    // Read stream — progressive playback for PCM, accumulate for everything else
    if (isPcm) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const sampleRate = provider === 'supertonic' ? 44100 : 24000;
      const actx = new AudioContext({ sampleRate });
      let scheduledUntil = 0;
      const allChunks = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        allChunks.push(value);

        // Schedule this PCM chunk for immediate playback
        const buf = new Int16Array(value.buffer);
        const float32 = new Float32Array(buf.length);
        for (let i = 0; i < buf.length; i++) float32[i] = buf[i] / 32768;

        const audioBuf = actx.createBuffer(1, float32.length, sampleRate);
        audioBuf.getChannelData(0).set(float32);
        const source = actx.createBufferSource();
        source.buffer = audioBuf;
        source.connect(actx.destination);
        const now = actx.currentTime;
        const startAt = Math.max(now, scheduledUntil);
        source.start(startAt);
        scheduledUntil = startAt + audioBuf.duration;

        btn.textContent = `Playing... (${(scheduledUntil - now).toFixed(0)}s buffered)`;
      }
      if (progressTimer) clearInterval(progressTimer);

      const finalWav = pcmToWav(flattenChunks(allChunks), sampleRate);
      renderAudio(finalWav, provider);
      btn.textContent = 'Speak';
    } else {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
      }
      if (progressTimer) clearInterval(progressTimer);
      const blob = new Blob(chunks, { type: r.headers.get('Content-Type') || 'audio/mpeg' });
      renderAudio(blob, provider);
      btn.textContent = 'Speak';
    }
  } catch (e) {
    ttsOutputEl.innerHTML = `<pre>Error: ${e.message}</pre>`;
    btn.textContent = 'Speak';
  }
  btn.disabled = false;
}

function flattenChunks(chunks) {
  const total = chunks.reduce((s, c) => s + c.length, 0);
  const buf = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  return buf.buffer;
}

function pcmToWav(pcmBuffer, sampleRate) {
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataSize = pcmBuffer.byteLength;
  const headerSize = 44;
  const buffer = new ArrayBuffer(headerSize + dataSize);
  const view = new DataView(buffer);

  function writeString(off, str) { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); }
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  const pcmView = new Uint8Array(pcmBuffer);
  new Uint8Array(buffer, headerSize, dataSize).set(pcmView);
  return buffer;
}

function renderAudio(wavBuffer, label) {
  const blob = new Blob([wavBuffer], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  ttsOutputEl.innerHTML = '';
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.src = url;
  const download = document.createElement('a');
  download.href = url;
  download.download = `${label}-${Date.now()}.wav`;
  download.textContent = '⬇ Download';
  download.style.cssText = 'display:block;font-size:0.8rem;color:#1e88e5;margin-top:4px;text-decoration:none;';
  ttsOutputEl.appendChild(audio);
  ttsOutputEl.appendChild(download);
}

let liveMicSession = null;
const LIVE_TRANSCRIPTION_INTERVAL_MS = 3000;
const LIVE_TRANSCRIPTION_SAMPLE_RATE = 16000;
const sttStatusEl = document.getElementById('stt-status');
const sttOutputEl = document.getElementById('stt-output');

async function toggleRecord() {
  const btn = document.getElementById('stt-record');
  if (liveMicSession?.recording) {
    stopLiveMic();
    return;
  }
  try {
    btn.disabled = true;
    sttOutputEl.textContent = '';
    sttStatusEl.textContent = 'Requesting microphone access...';
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });
    const context = new AudioContext();
    await context.resume();
    const source = context.createMediaStreamSource(stream);
    const gain = context.createGain();
    gain.gain.value = 0;

    const session = {
      stream,
      context,
      source,
      gain,
      recorder: null,
      chunks: [],
      sampleCount: 0,
      recording: true,
      inFlight: false,
      pending: false,
      finalRequested: false,
      finalCompleted: false,
      lastSentSamples: 0,
      timer: null,
    };
    liveMicSession = session;
    const receiveChunk = chunk => {
      if (!(chunk instanceof Float32Array) || chunk.length === 0) return;
      session.chunks.push(chunk);
      session.sampleCount += chunk.length;
    };

    if (context.audioWorklet) {
      await context.audioWorklet.addModule(API + '/pcm-recorder-worklet.js');
      const recorder = new AudioWorkletNode(context, 'pcm-recorder');
      recorder.port.onmessage = event => receiveChunk(event.data);
      source.connect(recorder);
      recorder.connect(gain);
      session.recorder = recorder;
    } else {
      const recorder = context.createScriptProcessor(4096, 1, 1);
      recorder.onaudioprocess = event => receiveChunk(new Float32Array(event.inputBuffer.getChannelData(0)));
      source.connect(recorder);
      recorder.connect(gain);
      session.recorder = recorder;
    }
    gain.connect(context.destination);
    session.timer = setInterval(() => transcribeLiveSnapshot(session), LIVE_TRANSCRIPTION_INTERVAL_MS);

    btn.classList.add('recording');
    btn.textContent = '⏹ Stop live mic';
    btn.disabled = false;
    sttStatusEl.textContent = 'Listening… transcript updates every few seconds';
  } catch (e) {
    if (liveMicSession) cleanupLiveMic(liveMicSession);
    liveMicSession = null;
    btn.disabled = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤 Start live mic';
    sttStatusEl.textContent = `Microphone unavailable: ${e.message}`;
  }
}

function stopLiveMic() {
  const session = liveMicSession;
  if (!session || !session.recording) return;
  session.recording = false;
  session.finalRequested = true;
  clearInterval(session.timer);
  if (session.recorder?.port) session.recorder.port.postMessage('flush');
  session.stream.getTracks().forEach(track => track.stop());
  session.source.disconnect();
  session.recorder.disconnect();
  session.gain.disconnect();
  setTimeout(() => session.context.close(), 100);

  const btn = document.getElementById('stt-record');
  btn.disabled = true;
  btn.classList.remove('recording');
  btn.textContent = 'Finalizing…';
  sttStatusEl.textContent = 'Finishing transcript…';
  setTimeout(() => transcribeLiveSnapshot(session, true), 50);
}

function cleanupLiveMic(session) {
  clearInterval(session.timer);
  session.stream?.getTracks().forEach(track => track.stop());
  try { session.source?.disconnect(); } catch {}
  try { session.recorder?.disconnect(); } catch {}
  try { session.gain?.disconnect(); } catch {}
  if (session.context && session.context.state !== 'closed') session.context.close();
}

async function transcribeLiveSnapshot(session, final = false) {
  if (session !== liveMicSession) return;
  if (final) session.finalRequested = true;
  if (session.inFlight) {
    session.pending = true;
    return;
  }
  if (session.sampleCount === 0) {
    if (session.finalRequested) finishLiveMic(session);
    return;
  }
  if (!session.finalRequested && session.sampleCount === session.lastSentSamples) return;

  const sentAsFinal = session.finalRequested && !session.recording;
  const sentSamples = session.sampleCount;
  const wav = encodeLiveWav(session.chunks, sentSamples, session.context.sampleRate);
  session.lastSentSamples = sentSamples;
  session.inFlight = true;
  session.pending = false;

  const seconds = sentSamples / session.context.sampleRate;
  sttStatusEl.textContent = session.recording
    ? `Listening… transcribing ${seconds.toFixed(1)}s`
    : 'Finishing transcript…';

  const fd = new FormData();
  fd.append('file', wav, 'live-microphone.wav');
  fd.append('response_format', 'json');
  fd.append('model', document.getElementById('stt-provider').value || 'auto');
  fd.append('stream', 'true');
  const language = document.getElementById('stt-language').value;
  if (language) fd.append('language', language);

  try {
    const response = await fetch(API + '/v1/audio/transcriptions', { method: 'POST', body: fd });
    if (!response.ok) {
      const error = await response.json().catch(() => ({ error: response.statusText }));
      throw new Error(error.error || response.statusText);
    }
    const result = await readTranscriptionEvents(response, partial => {
      sttOutputEl.textContent = partial;
    });
    sttOutputEl.textContent = result.text || '';
    sttStatusEl.textContent = session.recording
      ? `Listening… updated from ${seconds.toFixed(1)}s of audio`
      : 'Done';
  } catch (e) {
    sttStatusEl.textContent = session.recording
      ? `Listening… transcription retrying (${e.message})`
      : `Transcription failed: ${e.message}`;
  } finally {
    session.inFlight = false;
    if (sentAsFinal) session.finalCompleted = true;
    if (session.finalRequested && !session.finalCompleted) {
      transcribeLiveSnapshot(session, true);
    } else if (session.pending && session.recording) {
      transcribeLiveSnapshot(session);
    } else if (session.finalCompleted) {
      finishLiveMic(session);
    }
  }
}

async function readTranscriptionEvents(response, onPartial) {
  if (!response.body) throw new Error('Streaming response body is unavailable');
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let finalText = '';

  const consumeBlock = block => {
    const data = block.split(/\r?\n/)
      .filter(line => line.startsWith('data:'))
      .map(line => line.slice(5).trim())
      .join('\n');
    if (!data || data === '[DONE]') return;
    const event = JSON.parse(data);
    if (event.type === 'transcript.text.delta') {
      finalText = event.delta || finalText;
      onPartial(finalText);
    } else if (event.type === 'transcript.text.done') {
      finalText = event.text || finalText;
      onPartial(finalText);
    } else if (event.type === 'error') {
      throw new Error(event.error?.message || 'Streaming transcription failed');
    }
  };

  while (true) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    let boundary;
    while ((boundary = buffer.search(/\r?\n\r?\n/)) >= 0) {
      const block = buffer.slice(0, boundary);
      const separator = buffer.slice(boundary).match(/^\r?\n\r?\n/)[0];
      buffer = buffer.slice(boundary + separator.length);
      consumeBlock(block);
    }
    if (done) break;
  }
  if (buffer.trim()) consumeBlock(buffer);
  return { text: finalText };
}

function finishLiveMic(session) {
  if (session !== liveMicSession) return;
  cleanupLiveMic(session);
  liveMicSession = null;
  const btn = document.getElementById('stt-record');
  btn.disabled = false;
  btn.classList.remove('recording');
  btn.textContent = '🎤 Start live mic';
  sttFileEl.value = '';
}

function encodeLiveWav(chunks, sampleCount, inputRate) {
  const input = new Float32Array(sampleCount);
  let offset = 0;
  for (const chunk of chunks) {
    const count = Math.min(chunk.length, sampleCount - offset);
    if (count <= 0) break;
    input.set(chunk.subarray(0, count), offset);
    offset += count;
  }
  const samples = resampleLinear(input, inputRate, LIVE_TRANSCRIPTION_SAMPLE_RATE);
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeText = (at, text) => {
    for (let i = 0; i < text.length; i++) view.setUint8(at + i, text.charCodeAt(i));
  };
  writeText(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeText(8, 'WAVE');
  writeText(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, LIVE_TRANSCRIPTION_SAMPLE_RATE, true);
  view.setUint32(28, LIVE_TRANSCRIPTION_SAMPLE_RATE * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeText(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const sample = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, sample < 0 ? sample * 32768 : sample * 32767, true);
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

function resampleLinear(input, inputRate, outputRate) {
  if (inputRate === outputRate) return input;
  const output = new Float32Array(Math.max(1, Math.round(input.length * outputRate / inputRate)));
  const ratio = inputRate / outputRate;
  for (let i = 0; i < output.length; i++) {
    const position = i * ratio;
    const left = Math.floor(position);
    const right = Math.min(left + 1, input.length - 1);
    const mix = position - left;
    output[i] = input[left] * (1 - mix) + input[right] * mix;
  }
  return output;
}

function doSttUpload() {
  const file = sttFileEl.files[0];
  if (!file) return;
  sttStatusEl.textContent = `Transcribing ${file.name}...`;
  doStt(file, file.name);
}

async function doStt(blob, filename) {
  const btn = document.getElementById('stt-record');
  const orig = btn.textContent;
  btn.disabled = true;
  btn.classList.remove('recording');
  sttStatusEl.textContent = 'Transcribing...';

  const fd = new FormData();
  fd.append('file', blob, filename);
  fd.append('response_format', 'json');
  fd.append('model', document.getElementById('stt-provider').value || 'auto');
  const lang = document.getElementById('stt-language').value;
  if (lang) fd.append('language', lang);

  try {
    const r = await fetch(API + '/v1/audio/transcriptions', {
      method: 'POST', body: fd,
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ error: r.statusText }));
      throw new Error(err.error);
    }
    const data = await r.json();
    sttOutputEl.textContent = data.text;
    sttStatusEl.textContent = 'Done';
  } catch (e) {
    sttOutputEl.textContent = `Error: ${e.message}`;
    sttStatusEl.textContent = 'Failed';
  }
  btn.disabled = false;
  btn.textContent = '🎤 Start live mic';
  sttFileEl.value = '';
}

const INSTRUCT_ITEMS = [
  { group: 'Pitch', items: ['very high pitch', 'high pitch', 'moderate pitch', 'low pitch', 'very low pitch'] },
  { group: 'Age/Gender', items: ['child', 'teenager', 'young adult', 'middle-aged', 'elderly', 'male', 'female'] },

function renderProviderOpts() {
  const container = document.getElementById('tts-provider-opts');
  const provider = ttsProviderEl.value;
  const opts = PROVIDER_OPTS[provider];
  if (!opts || !opts.length) { container.hidden = true; return; }
  container.hidden = false;

  let html = '';
  let row = '';
  let count = 0;
  for (const o of opts) {
    if (o.type === 'instruct') {
      html += '<div class="instruct-group">';
      for (const g of INSTRUCT_ITEMS) {
        html += `<div class="group-label">${g.group}</div><div class="instruct-items">`;
        for (const item of g.items) {
          html += `<label><input type="checkbox" class="tpo-instruct" value="${item}">${item}</label>`;
        }
        html += '</div>';
      }
      html += '</div>';
    } else {
      const step = o.step || 1;
      row += `<div><label title="${o.help}">${o.label}</label>
        <input id="tpo-${o.key}" type="${o.type}" min="${o.min || ''}" max="${o.max || ''}" step="${step}" value="${o.default}"></div>`;
      count++;
      if (count % 2 === 0) { html += '<div class="row">' + row + '</div>'; row = ''; }
    }
  }
  if (row) html += '<div class="row">' + row + '<div></div></div>';
  container.innerHTML = html;
}

function getProviderOptions() {
  const provider = ttsProviderEl.value;
  const opts = PROVIDER_OPTS[provider];
  if (!opts) return undefined;
  const result = {};
  for (const o of opts) {
    if (o.type === 'instruct') {
      const checked = document.querySelectorAll('.tpo-instruct:checked');
      if (checked.length > 0) {
        result.instruct = Array.from(checked).map(c => c.value).join(', ');
      }
    } else {
      const el = document.getElementById('tpo-' + o.key);
      if (!el) continue;
      const v = el.value.trim();
      if (v === '' || v === String(o.default)) continue;
      result[o.key] = o.type === 'number' ? parseFloat(v) : v;
    }
  }
  return Object.keys(result).length ? result : undefined;
}

async function loadAlignLanguages() {
  try {
    const r = await fetch(API + '/v1/audio/alignments/models');
    if (!r.ok) return;
    const data = await r.json();
    const sel = document.getElementById('align-language');
    for (const lang of (data.languages || [])) {
      const opt = document.createElement('option');
      opt.value = lang;
      opt.textContent = lang;
      sel.appendChild(opt);
    }
  } catch (e) {}
}

async function doAlign() {
  const file = document.getElementById('align-audio').files[0];
  const transcript = document.getElementById('align-transcript').value.trim();
  const language = document.getElementById('align-language').value;
  if (!file || !transcript || !language) return;

  const btn = document.getElementById('align-submit');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const fd = new FormData();
  fd.append('file', file);
  fd.append('transcript', transcript);
  fd.append('language', language);

  try {
    const r = await fetch(API + '/v1/audio/alignments', { method: 'POST', body: fd });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ error: r.statusText }));
      throw new Error(err.error);
    }
    const job = await r.json();

    let poll;
    poll = setInterval(async () => {
      const sr = await fetch(API + '/v1/audio/alignments/' + job.id);
      const state = await sr.json();
      document.getElementById('align-status').textContent = `Status: ${state.status}`;
      btn.textContent = `Aligning... (${state.status})`;
      if (state.status === 'succeeded') {
        clearInterval(poll);
        if (state.result && state.result.words) {
          let html = '<table style="width:100%;font-size:0.8rem;border-collapse:collapse;">';
          for (const w of state.result.words) {
            html += `<tr><td style="padding:2px 8px;border-bottom:1px solid #222;">${(w.start || 0).toFixed(2)}s</td><td style="padding:2px 8px;border-bottom:1px solid #222;">${w.text}</td></tr>`;
          }
          html += '</table>';
          document.getElementById('align-output').innerHTML = html;
          document.getElementById('align-status').textContent = `Done — ${state.result.words.length} words aligned`;
        }
        btn.textContent = 'Align';
        btn.disabled = false;
      } else if (state.status === 'failed') {
        clearInterval(poll);
        document.getElementById('align-output').innerHTML = `<pre>Error: ${state.error || 'failed'}</pre>`;
        btn.textContent = 'Align';
        btn.disabled = false;
      }
    }, 2000);
  } catch (e) {
    document.getElementById('align-output').innerHTML = `<pre>Error: ${e.message}</pre>`;
    btn.textContent = 'Align';
    btn.disabled = false;
  }
}
